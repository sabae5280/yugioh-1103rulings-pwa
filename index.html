<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a32">
  <meta name="description" content="1103・1209・1402環境の裁定を検索・確認できる非公式アーカイブ">
  <title>遊戯王 GB 裁定アーカイブ</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-slides" aria-hidden="true"><div class="hero-frame"><div></div></div><div class="hero-frame"><div></div></div></div>
    <button id="heroMotion" class="hero-motion" type="button" aria-label="背景の切り替えを一時停止" aria-pressed="false">Ⅱ</button>
    <div class="hero__inner">
      <div class="hero-copy">
        <h1>
          <button id="homeButton" class="home-button" type="button" aria-label="遊戯王 GB 裁定アーカイブ：初期トップ画面に戻る"><span class="archive-title">遊戯王 GB 裁定アーカイブ</span></button>
        </h1>
        <p class="hero-subtitle">Master Rule 2 《1103・1209・1402》</p>
      </div>
      <button id="shareButton" class="share-button" type="button" aria-label="このサイトを共有">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .16 1l-7.1 4.14a3.5 3.5 0 1 0 0 5.72l7.1 4.14A3 3 0 1 0 16 17.2l-7.1-4.14a3.5 3.5 0 0 0 0-2.12L16 6.8A3 3 0 0 0 18 8Z"/></svg>
        <span>共有</span>
      </button>
      <div class="hero-actions">
        <button id="installButton" class="install-button" type="button" hidden>ホーム画面に追加</button>
        <button id="menuButton" class="menu-button" type="button" aria-haspopup="dialog" aria-controls="siteMenu">
          <span aria-hidden="true">☰</span> メニュー
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="search-panel" aria-label="裁定検索">
      <label for="searchInput">カード名・ルビ・裁定内容を検索</label>
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="例：ライオウ、禁じられた、ダメステ" autocomplete="off">
        <button id="clearButton" type="button" aria-label="検索文字を消去">×</button>
      </div>
        <details id="formatPicker" class="filter-section environment-section">
          <summary>フォーマット： <span id="environmentSummary" class="selection-summary">すべての掲載カード</span></summary>
          <fieldset class="environment-filter">
            <legend class="visually-hidden">対応環境</legend>
            <div class="environment-options">
              <label class="environment-option" data-format="all"><input type="radio" name="environmentMode" value="all" checked><span><strong>すべての掲載カード</strong><small>『マスタールール2』の対象カード</small></span></label>
              <label class="environment-option" data-format="1103"><input type="radio" name="environmentMode" value="1103"><span><strong>1103環境</strong><small>『寒波亭ルール』対応：〜2011/8/31</small></span></label>
              <label class="environment-option" data-format="1209"><input type="radio" name="environmentMode" value="1209"><span><strong>1209環境</strong><small>『熱波亭-LIMITED-ルール』対応：〜2012/12/21</small></span></label>
              <label class="environment-option" data-format="1209-only"><input type="radio" name="environmentMode" value="1209-only"><span><strong>1209新規カード・新規裁定を含む既存カード</strong><small>対象：2011/9/1〜2012/12/21</small></span></label>
              <label class="environment-option" data-format="1402-only"><input type="radio" name="environmentMode" value="1402-only"><span><strong>1402新規カード・新規裁定を含む既存カード</strong><small>対象：2012/12/22〜2014/2/28</small></span></label>
            </div>
          </fieldset>
        </details>
      <p id="shareStatus" class="visually-hidden" aria-live="polite"></p>
      <div class="advanced-controls">
        <button id="advancedToggle" class="advanced-toggle" type="button" aria-expanded="false" aria-controls="advancedPanel">
          詳細検索 <span aria-hidden="true">⌄</span>
        </button>
      </div>
      <div id="activeConditions" class="active-conditions" aria-label="適用中の絞り込み条件"></div>
      <div id="advancedPanel" class="advanced-panel" hidden>
      <nav id="rowNavigation" class="row-navigation" aria-label="五十音順の行へ移動"></nav>
      <div id="filters" class="filters" aria-label="カード種別">
        <button class="filter is-active" type="button" data-filter="all">すべて</button>
        <button class="filter" type="button" data-filter="monster">モンスター</button>
        <button class="filter" type="button" data-filter="spell">魔法</button>
        <button class="filter" type="button" data-filter="trap">罠</button>
        <button class="filter" type="button" data-filter="category">テーマ共通効果</button>
      </div>

        <div id="advancedFilters" class="advanced-filter-groups"></div>
        <div class="filter-actions"><button id="clearConditions" type="button">条件をクリア</button><button id="showResults" type="button">結果を見る</button></div>
      </div>
    </section>

    <section class="result-section" aria-live="polite">
      <div class="result-heading">
        <h2>裁定一覧</h2>
        <p id="resultCount"></p>
      </div>
      <div id="rulingList" class="ruling-list"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>該当する裁定が見つかりませんでした。</p>
        <button id="resetButton" type="button">検索条件をリセット</button>
      </div>
    </section>

    <aside id="iosTip" class="ios-tip" hidden>
      <strong>iPhone・iPadへの追加方法</strong>
      <span>共有ボタンから「ホーム画面に追加」を選択してください。</span>
    </aside>
  </main>

  <footer>
    <p>非公式の裁定資料です。<br>大会では主催者・ジャッジの判断を優先してください。</p>
  </footer>

  <button id="backToCard" class="back-to-card" type="button" aria-label="前のカードに戻る" title="前のカードに戻る" hidden>
    <span aria-hidden="true">←</span><small>Back</small>
  </button>
  <button id="backToTop" class="back-to-top" type="button" aria-label="ページの先頭へ戻る" title="ページの先頭へ戻る">
    <span aria-hidden="true">↑</span><small>TOP</small>
  </button>

  <div id="imageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="カード画像の拡大表示" hidden>
    <button id="lightboxClose" class="lightbox-close" type="button" aria-label="拡大画像を閉じる">×</button>
    <img id="lightboxImage" alt="">
  </div>

  <div id="siteMenu" class="site-menu" role="dialog" aria-modal="true" aria-labelledby="menuPageTitle" hidden>
    <button class="site-menu__backdrop" type="button" data-menu-close aria-label="メニューを閉じる"></button>
    <section class="site-menu__drawer">
      <div class="site-menu__header">
        <strong>メニュー</strong>
        <button id="menuClose" class="site-menu__close" type="button" aria-label="メニューを閉じる">×</button>
      </div>
      <nav class="site-menu__nav" aria-label="サイトメニュー">
        <button type="button" data-menu-page="about">このサイトについて</button>
        <button type="button" data-menu-page="guide">使い方</button>
        <button type="button" data-menu-page="contact">お問い合わせ</button>
        <button type="button" data-menu-page="links">各種リンク集</button>
      </nav>
      <article class="site-menu__page">
        <h2 id="menuPageTitle">このサイトについて</h2>
        <p id="menuPageBody">現在準備中です。</p>
      </article>
    </section>
  </div>

  <script src="./card-metadata.js"></script>
  <script src="./card-metadata-a-row-batch-04.js"></script>
  <script src="./card-metadata-a-row-batch-05.js"></script>
  <script src="./card-readings.js"></script>
  <script src="./rulings.js"></script>
  <script src="./rulings-a-row-batch-04.js"></script>
  <script src="./rulings-a-row-batch-05.js"></script>
  <script src="./rulings-k-row.js"></script>
  <script src="./rulings-s-row.js"></script>
  <script src="./rulings-s-row-remaining.js"></script>
  <script src="./s-row-overview-fixes.js"></script>
  <script src="./corrections-a-row.js"></script>
  <script src="./rulings-t-row.js"></script>
  <script src="./rulings-h-row.js"></script>
  <script src="./rulings-n-row.js"></script>
  <script src="./rulings-r-row.js"></script>
  <script src="./rulings-m-row.js"></script>
  <script src="./rulings-w-row.js"></script>
  <script src="./rulings-m-row-fixes.js"></script>
  <script src="./rulings-a-o-j-row.js"></script>
  <script src="./site-enhancements.js"></script>
  <script src="./rulings-update-20261004.js"></script>
  <script src="./rulings-instructions-20261004.js"></script>
  <script src="./rulings-instructions-20261007.js"></script>
  <script src="./rulings-instructions-20261007-04.js"></script>
  <script src="./rulings-instructions-20261007-05.js"></script>
  <script src="./rulings-instructions-20261009.js"></script>
  <script src="./rulings-instructions-20261009-2.js"></script>
  <script src="./search-config.js"></script>
  <script src="./rulings-update-20261012.js"></script>
  <script src="./rulings-ta-20261012.js"></script>
  <script src="./hero-background.js"></script>
  <script src="./app.js"></script>
</body>
</html>
